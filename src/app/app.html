@if (currentUser$ | async; as user) {
  <mat-toolbar color="primary" class="main-navbar">
    <span class="brand" routerLink="/home">🍲 ReceptiApp</span>

    <div class="nav-links">
      <a mat-button routerLink="/home" routerLinkActive="active-tab">Početna</a>
      <a mat-button routerLink="/search" routerLinkActive="active-tab">Pretraga</a>
      <a mat-button [routerLink]="['/profile', 'milana_chef']" routerLinkActive="active-tab">Profil: Milana</a>
      <a mat-button [routerLink]="['/profile', 'marko_kuvar']" routerLinkActive="active-tab">Profil: Marko</a>
      @if (user.role === 'ADMIN') {
        <a mat-button routerLink="/admin" routerLinkActive="active-tab">Admin šifarnici</a>
      }
    </div>

    <div class="role-switcher">
      <button mat-stroked-button color="accent" type="button" (click)="toggleUser()">
        Nalog: {{ user.username }} (Promeni nalog)
      </button>
      <button mat-stroked-button color="accent" type="button" (click)="toggleRole(user.role)">
        Uloga: {{ user.role }}
      </button>
    </div>
  </mat-toolbar>
}

<main class="main-container">
  <router-outlet></router-outlet>
</main>
