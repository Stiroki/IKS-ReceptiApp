@if (currentUser$ | async; as user) {
  <mat-toolbar color="primary" class="main-navbar">
    <span class="brand" [routerLink]="['/profile', user.username]">🍲 ReceptiApp</span>

    <div class="nav-links">
      <a mat-button routerLink="/home" routerLinkActive="active-tab">Početna</a>
      <a mat-button routerLink="/search" routerLinkActive="active-tab">Pretraga</a>
      <a mat-button routerLink="/recipes/new">+ Novi recept</a>
      <a mat-button [routerLink]="['/profile', user.username]">Moj profil ({{ user.username }})</a>
      <a mat-button [routerLink]="['/profile', 'marko_kuvar']">Tuđi profil (Marko)</a>
      @if (user.role === 'ADMIN') {
        <a mat-button routerLink="/admin">Admin šifarnici</a>
      }
    </div>

    <div class="role-switcher">
      <small>Uloga: </small>
      <button
        mat-stroked-button
        color="accent"
        (click)="onRoleChange(user.role === 'ADMIN' ? 'USER' : 'ADMIN')"
      >
        {{ user.role }} (Promeni)
      </button>
    </div>
  </mat-toolbar>
}

<main class="main-container">
  <router-outlet></router-outlet>
</main>
